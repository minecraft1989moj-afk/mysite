<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockQuest Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0B0914] text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                fetch('https://www.cheapshark.com/api/1.0/deals?upperPrice=20&pageSize=10')
                    .then(res => res.json())
                    .then(json => {
                        setData(json);
                        setLoading(false);
                    })
                    .catch(() => setLoading(false));
            }, []);

            return (
                <div className="min-h-screen p-6">
                    <nav className="flex justify-between items-center mb-10 border-b border-white/10 pb-4">
                        <h1 className="text-2xl font-bold text-purple-500">StockQuest</h1>
                        <span className="text-xs bg-green-500/20 text-green-400 px-2 py-1 rounded">Live Market</span>
                    </nav>

                    {loading ? (
                        <div className="text-center mt-20 text-gray-500">Loading live deals...</div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {data.map(item => (
                                <div key={item.dealID} className="bg-[#151221] p-4 rounded-2xl border border-white/5">
                                    <img src={item.thumb} className="w-full h-32 object-contain mb-4 rounded-lg" />
                                    <h2 className="font-bold mb-2 truncate">{item.title}</h2>
                                    <div className="flex justify-between items-center">
                                        <span className="text-green-400 font-bold">${item.salePrice}</span>
                                        <a href={`https://www.cheapshark.com/redirect?dealID=${item.dealID}`} target="_blank" className="text-xs bg-purple-600 px-3 py-1 rounded-lg">View Deal</a>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
